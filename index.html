<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeador FTTH - FX Telecom</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Barra de Controle Superior */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn.ativo {
            background-color: #28a745 !important;
            box-shadow: 0 0 8px rgba(40, 167, 69, 0.6);
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #bd2130;
        }

        #status-modo {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 15px;
        }

        /* Modais */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background-color: #fff;
            margin: 8% auto;
            padding: 20px 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #007bff;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #495057;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        /* Responsividade para celulares */
        @media (max-width: 600px) {
            .top-bar {
                top: 10px;
                width: 92%;
                border-radius: 15px;
                padding: 8px;
            }
            .btn {
                padding: 6px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE FERRAMENTAS PRINCIPAL -->
    <div class="top-bar">
        <button id="btn-caixas" class="btn">📦 Adicionar Caixa</button>
        <button id="btn-fibras" class="btn">🧵 Traçar Fibra</button>
        <button id="btn-concluir-fibra" class="btn btn-ativo" style="display: none; background-color: #28a745;">✅ Finalizar Cabo</button>
        <button id="btn-gps" class="btn">🎯 Minha Posição</button>
        <button id="btn-navegacao" class="btn">🧭 Iniciar Navegação</button>
        <span id="status-modo">Modo: Navegação</span>
    </div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- MODAL DE CADASTRO DE CAIXA -->
    <div id="modal-caixa" class="modal">
        <div class="modal-content">
            <h3>Cadastrar Caixa FTTH</h3>
            
            <div class="form-group">
                <label for="tipo-caixa">Tipo de Elemento:</label>
                <select id="tipo-caixa">
                    <option value="CTO">CTO (Atendimento)</option>
                    <option value="CEO">CEO (Emenda)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="nome-caixa">Identificação / Nome:</label>
                <input type="text" id="nome-caixa" placeholder="Ex: CTO-01">
            </div>

            <!-- Campos específicos CTO -->
            <div id="campos-cto" class="form-group">
                <label for="portas-atendimento">Quantidade de Portas:</label>
                <select id="portas-atendimento">
                    <option value="8">8 Portas</option>
                    <option value="16" selected>16 Portas</option>
                </select>
            </div>

            <!-- Campos específicos CEO -->
            <div id="campos-ceo" class="form-group" style="display: none;">
                <label for="qtd-fusoes">Capacidade de Fusões:</label>
                <input type="number" id="qtd-fusoes" value="48" placeholder="Ex: 24, 48, 96">
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label for="caixa-lat">Latitude:</label>
                    <input type="text" id="caixa-lat" readonly>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="caixa-lng">Longitude:</label>
                    <input type="text" id="caixa-lng" readonly>
                </div>
            </div>

            <button type="button" id="btn-usar-gps-form" class="btn" style="width: 100%; margin-top: 5px; justify-content: center;">
                📍 Capturar Posição GPS
            </button>

            <div class="modal-actions">
                <button id="btn-cancelar" class="btn btn-danger">Cancelar</button>
                <button id="btn-salvar" class="btn">Salvar Caixa</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO DE FIBRA -->
    <div id="modal-fibra" class="modal">
        <div class="modal-content">
            <h3>Cadastrar Cabo de Fibra</h3>

            <div class="form-group">
                <label for="identificacao-cabo">Identificação do Cabo:</label>
                <input type="text" id="identificacao-cabo" placeholder="Ex: Cabo-AS80-01">
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label for="sobra-ponto-a">Sobra Ponto A (m):</label>
                    <input type="number" id="sobra-ponto-a" value="15" placeholder="Metros">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="sobra-ponto-b">Sobra Ponto B (m):</label>
                    <input type="number" id="sobra-ponto-b" value="15" placeholder="Metros">
                </div>
            </div>

            <div class="modal-actions">
                <button id="btn-cancelar-fibra" class="btn btn-danger">Cancelar</button>
                <button id="btn-salvar-fibra" class="btn">Salvar Cabo</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Módulo Principal ES6 -->
    <script type="module" src="./main.js"></script>
</body>
</html>
